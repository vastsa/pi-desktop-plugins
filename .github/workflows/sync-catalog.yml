name: sync-catalog

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull catalog from plugins.aiuo.net
        env:
          PI_PLUGIN_CATALOG_URL: https://plugins.aiuo.net/catalog.json
        run: python3 scripts/sync_catalog.py
      - name: Commit only when the mirror changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json catalog.json.sig packages
          if git diff --cached --quiet; then
            echo "mirror already up to date"
            exit 0
          fi
          git commit -m "chore(mirror): sync catalog from plugins.aiuo.net"
          git push
