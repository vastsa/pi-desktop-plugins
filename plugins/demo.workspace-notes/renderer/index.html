<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    PI-Desktop owns exactly a 46px drag band and a minimal three-button
    window-control capsule. This panel uses pi-plugin-chrome=v3: the page can
    paint through the 46px band, while host-generated holes keep controls
    clickable and empty space draggable. Fixed or sticky panel surfaces use
    var(--pi-plugin-titlebar-height, 46px).
  -->
  <meta name="pi-plugin-chrome" content="v3" />
  <title>Workspace Notes</title>
  <script>window.__APPEARANCE_CACHE_KEY = "demo.workspace-notes.appearance.v1";</script>
  <script src="./appearance-boot.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fb;
      --card: #ffffff;
      --line: #dde3ee;
      --text: #1c2333;
      --muted: #5a6a8c;
      --accent: #4f7cff;
      --accent-text: #ffffff;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b1020;
      --card: #121a2f;
      --line: #24304d;
      --text: #e8eefc;
      --muted: #9db0d4;
      --accent: #4f7cff;
      --accent-text: #ffffff;
    }
    body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
    textarea { width: 100%; min-height: 180px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: inherit; padding: 10px; box-sizing: border-box; }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button { border: 0; border-radius: 8px; padding: 8px 12px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
    button.secondary { background: var(--line); color: var(--text); }
    .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  </style>
  <link rel="stylesheet" href="./panel-polish.css" />
</head>
<body>
  <div class="meta" id="meta">High-risk demo: workspace files, clipboard, network, external links.</div>
  <textarea id="notes" placeholder="Workspace NOTES.md"></textarea>
  <div class="row">
    <button id="reload">Reload</button>
    <button id="save">Save</button>
    <button class="secondary" id="clip">Copy</button>
    <button class="secondary" id="fetch">Fetch sample</button>
    <button class="secondary" id="docs">Open docs</button>
  </div>
  <script src="./appearance.js"></script>
  <script>
    const I18N = {
      "en": {
        meta: "High-risk demo: workspace files, clipboard, network, external links.",
        placeholder: "Workspace NOTES.md",
        reload: "Reload", save: "Save", copy: "Copy", fetch: "Fetch sample", docs: "Open docs",
        saved: "Saved NOTES.md", copied: "Copied to clipboard",
      },
      "zh-CN": {
        meta: "高风险示例：工作区文件、剪贴板、网络、外部链接。",
        placeholder: "工作区 NOTES.md",
        reload: "重新加载", save: "保存", copy: "复制", fetch: "抓取示例", docs: "打开文档",
        saved: "已保存 NOTES.md", copied: "已复制到剪贴板",
      },
    };
    function currentLocale() {
      return window.__appearance.current().locale || document.documentElement.lang || "en";
    }
    const t = (key) => (I18N[currentLocale()] || I18N["en"])[key];

    const notes = document.getElementById('notes');
    notes.placeholder = t('placeholder');
    document.getElementById('meta').textContent = t('meta');
    document.getElementById('reload').textContent = t('reload');
    document.getElementById('save').textContent = t('save');
    document.getElementById('clip').textContent = t('copy');
    document.getElementById('fetch').textContent = t('fetch');
    document.getElementById('docs').textContent = t('docs');

    async function reload() {
      try { notes.value = await window.pluginBridge.invoke('fs.readText', { path: 'NOTES.md' }); }
      catch { notes.value = '# Notes\n\n'; }
    }
    document.getElementById('reload').onclick = reload;
    document.getElementById('save').onclick = async () => {
      await window.pluginBridge.invoke('fs.writeText', { path: 'NOTES.md', content: notes.value });
      await window.pluginBridge.invoke('ui.showToast', { message: t('saved') });
    };
    document.getElementById('clip').onclick = async () => {
      await window.pluginBridge.invoke('clipboard.writeText', { text: notes.value });
      await window.pluginBridge.invoke('ui.showToast', { message: t('copied') });
    };
    document.getElementById('fetch').onclick = async () => {
      const res = await window.pluginBridge.invoke('net.fetch', {
        url: 'https://example.com',
        method: 'GET',
        timeoutMs: 8000,
      });
      notes.value = `${notes.value.trim()}\n\n<!-- fetched status ${res.status} -->\n`;
    };
    document.getElementById('docs').onclick = async () => {
      await window.pluginBridge.invoke('shell.openExternal', { url: 'https://example.com' });
    };

    window.__appearance.init(window.pluginBridge);
    window.__appearance.onLocaleChange(() => {
      const locale = currentLocale();
      notes.placeholder = t('placeholder');
      document.getElementById('meta').textContent = t('meta');
      document.getElementById('reload').textContent = t('reload');
      document.getElementById('save').textContent = t('save');
      document.getElementById('clip').textContent = t('copy');
      document.getElementById('fetch').textContent = t('fetch');
      document.getElementById('docs').textContent = t('docs');
    });
    reload();
  </script>
</body>
</html>
