<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #f1ebdf; color: #2a2620; font-family: system-ui, sans-serif; }
  body { padding: 18px; line-height: 1.55; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  p { font-size: 13px; margin: 0 0 10px; color: #4a443a; }
  code { font-family: ui-monospace, Consolas, monospace; background: rgba(42,38,32,.06); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  ul { margin: 0; padding-left: 18px; font-size: 13px; color: #4a443a; }
  li { margin: 4px 0; }
</style>
</head>
<body>
  <h1>Parchment Theme</h1>
  <p>This plugin contributes one global theme and nothing else.</p>
  <ul>
    <li>Apply: Settings -&gt; Theme -&gt; search <code>Parchment</code></li>
    <li>Revert: pick Light / Dark / System in the theme picker</li>
  </ul>
  <p>Theme file: <code>themes/parchment.css</code> (edit it, then restart the app).</p>
</body>
</html>
