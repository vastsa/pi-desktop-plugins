<!doctype html>
<html lang="en" data-booting="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Git Lens docks in the host work panel (contributes.views). Embedded views
      have no window-control capsule and publish --pi-plugin-titlebar-height as
      0px. Keep reading that variable instead of hard-coding 46px.
    -->
    <meta name="pi-plugin-chrome" content="v3" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none';" />
    <title>Git Lens</title>
    <script>window.__APPEARANCE_CACHE_KEY = "pi.gitlens.appearance.v1";</script>
    <script src="./appearance-boot.js"></script>
    <link rel="stylesheet" href="panel.css" />
    <link rel="stylesheet" href="panel-polish.css" />
  </head>
  <body>
    <div class="app">
      <header class="chrome">
        <div class="status-line">
          <span class="status-branch" id="branchChip"></span>
          <span class="status-meta" id="repoChip"></span>
          <button type="button" class="icon-button" id="refreshAll" aria-label="Refresh"></button>
        </div>
        <nav class="segmented" id="nav" role="tablist" aria-label="Git Lens views"></nav>
      </header>
      <div class="banner" id="banner" hidden></div>
      <main class="content">
        <section class="view" id="view-overview" hidden></section>
        <section class="view" id="view-history" hidden></section>
        <section class="view" id="view-diff" hidden></section>
        <section class="view" id="view-branches" hidden></section>
        <section class="view" id="view-blame" hidden></section>
      </main>
    </div>

    <script src="./appearance.js"></script>
    <script src="./panel.js"></script>
  </body>
</html>
