<!doctype html>
<html lang="en" data-booting="true">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      PI-Desktop owns exactly a transparent 46px drag band and the
      three-button window-control capsule. This panel has no private
      window chrome. The host publishes the fixed offset through
      var(--pi-plugin-titlebar-height, 46px).
    -->
    <meta name="pi-plugin-chrome" content="v3" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none';" />
    <title>Agents</title>
    <script>window.__APPEARANCE_CACHE_KEY = "pi.session-orchestrator.appearance.v1";</script>
    <script src="./appearance-boot.js"></script>
    <link rel="stylesheet" href="./panel.css" />
    <link rel="stylesheet" href="./panel-polish.css" />
  </head>
  <body>
    <header class="toolbar">
      <div>
        <p class="eyebrow" data-i18n="eyebrow">SESSION ORCHESTRATOR</p>
        <h1 data-i18n="title">Agents</h1>
      </div>
      <button id="refresh" class="secondary" type="button" data-i18n="refresh">Refresh</button>
    </header>
    <main id="workers" aria-live="polite"></main>
    <p id="error" class="error" role="alert" hidden></p>
    <script src="./panel.js"></script>
    <script src="./appearance.js"></script>
    <script src="./capsule-retint.js"></script>
  </body>
</html>
