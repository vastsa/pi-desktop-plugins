<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace Summary</title>
  <script>window.__APPEARANCE_CACHE_KEY = "demo.workspace-summary.appearance.v1";</script>
  <script src="./appearance-boot.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fb;
      --card: #ffffff;
      --line: #dde3ee;
      --text: #1c2333;
      --muted: #5a6a8c;
      --accent: #4f7cff;
      --accent-text: #ffffff;
      --chip: rgba(15, 23, 42, 0.03);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b1020;
      --card: #121a2f;
      --line: #24304d;
      --text: #e8eefc;
      --muted: #9db0d4;
      --accent: #4f7cff;
      --accent-text: #ffffff;
      --chip: rgba(255, 255, 255, 0.02);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .muted { color: var(--muted); margin-bottom: 12px; }
    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      padding: 12px;
      margin-bottom: 12px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
    }
    button.secondary { background: var(--line); color: var(--text); }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--text);
      max-height: 360px;
      overflow: auto;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: var(--chip);
    }
    .stat b { display: block; font-size: 16px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1 id="title">Workspace Summary</h1>
  <div class="muted" id="subtitle">Practical template plugin: inventory + README preview + clipboard export.</div>
  <div class="row">
    <button id="refresh">Refresh</button>
    <button class="secondary" id="copy">Copy summary</button>
  </div>
  <div class="stats">
    <div class="stat"><span id="statTopLabel">Top-level</span><b id="topCount">-</b></div>
    <div class="stat"><span id="statFilesLabel">Files</span><b id="fileCount">-</b></div>
    <div class="stat"><span id="statReadmeLabel">README</span><b id="readmeName">-</b></div>
  </div>
  <div class="card"><pre id="out">Open a workspace, then click Refresh.</pre></div>
  <script src="./appearance.js"></script>
  <script>
    const I18N = {
      "en": {
        title: "Workspace Summary",
        subtitle: "Practical template plugin: inventory + README preview + clipboard export.",
        refresh: "Refresh", copy: "Copy summary",
        statTop: "Top-level", statFiles: "Files", statReadme: "README",
        scanning: "Scanning workspace…",
        noWorkspace: "No workspace is open.",
        none: "none",
        mdTitle: "Workspace Summary",
        project: "Project", path: "Path",
        topLevel: "Top-level entries", fileCount: "Approximate file count",
        topLevelHeading: "Top-level",
        generatedBy: "_Generated by demo.workspace-summary_",
        copied: "Summary copied",
      },
      "zh-CN": {
        title: "工作区摘要",
        subtitle: "实用模板插件：清单 + README 预览 + 剪贴板导出。",
        refresh: "刷新", copy: "复制摘要",
        statTop: "顶层条目", statFiles: "文件", statReadme: "README",
        scanning: "正在扫描工作区…",
        noWorkspace: "未打开工作区。",
        none: "无",
        mdTitle: "工作区摘要",
        project: "项目", path: "路径",
        topLevel: "顶层条目数", fileCount: "文件数（约）",
        topLevelHeading: "顶层条目",
        generatedBy: "_由 demo.workspace-summary 生成_",
        copied: "摘要已复制",
      },
    };
    function currentLocale() {
      return window.__appearance.current().locale || document.documentElement.lang || "en";
    }
    const t = (key) => (I18N[currentLocale()] || I18N["en"])[key];
    function applyLocale() {
      document.getElementById("title").textContent = t("title");
      document.getElementById("subtitle").textContent = t("subtitle");
      document.getElementById("refresh").textContent = t("refresh");
      document.getElementById("copy").textContent = t("copy");
      document.getElementById("statTopLabel").textContent = t("statTop");
      document.getElementById("statFilesLabel").textContent = t("statFiles");
      document.getElementById("statReadmeLabel").textContent = t("statReadme");
    }

    let latestText = "";

    async function buildSummaryLocal() {
      const settings = await window.pluginBridge.invoke("plugin.getSettings");
      const maxEntries = Number(settings?.maxEntries ?? 30) || 30;
      const includeDotfiles = Boolean(settings?.includeDotfiles ?? false);
      const workspace = await window.pluginBridge.invoke("workspace.get");
      if (!workspace) {
        return {
          text: t("noWorkspace"),
          topLevelCount: 0,
          fileCount: 0,
          readmeName: null,
        };
      }

      const all = await window.pluginBridge.invoke("fs.glob", { pattern: "**/*" });
      const skip = new Set([".git", "node_modules", "target", "dist", "build", ".next", ".cache", "out", "coverage"]);
      const visible = (all || []).filter((rel) => {
        const parts = String(rel).split("/");
        if (parts.some((p) => skip.has(p))) return false;
        if (!includeDotfiles && parts.some((p) => p.startsWith("."))) return false;
        return true;
      });
      const topLevel = [...new Set(visible.map((rel) => String(rel).split("/")[0]))]
        .filter(Boolean)
        .sort((a, b) => a.localeCompare(b))
        .slice(0, maxEntries);

      let readmeName = null;
      let readmeExcerpt = null;
      for (const name of ["README.md", "README.MD", "Readme.md", "readme.md"]) {
        try {
          const text = await window.pluginBridge.invoke("fs.readText", { path: name });
          readmeName = name;
          const normalized = String(text || "").replace(/\r\n/g, "\n").trim();
          readmeExcerpt = normalized.length > 600 ? normalized.slice(0, 600).trimEnd() + "\n…" : normalized;
          break;
        } catch {}
      }

      const lines = [
        `# ${t("mdTitle")}`,
        "",
        `- ${t("project")}: ${workspace.name}`,
        `- ${t("path")}: ${workspace.path}`,
        `- ${t("topLevel")}: ${topLevel.length}`,
        `- ${t("fileCount")}: ${visible.length}`,
        "",
        `## ${t("topLevelHeading")}`,
        ...topLevel.map((name) => `- ${name}`),
      ];
      if (readmeName) {
        lines.push("", `## ${readmeName}`, "", readmeExcerpt || "");
      }
      lines.push("", t("generatedBy"));
      return {
        text: lines.join("\n"),
        topLevelCount: topLevel.length,
        fileCount: visible.length,
        readmeName,
      };
    }

    async function refresh() {
      const out = document.getElementById("out");
      out.textContent = t("scanning");
      try {
        const summary = await buildSummaryLocal();
        latestText = summary.text;
        out.textContent = summary.text;
        document.getElementById("topCount").textContent = String(summary.topLevelCount);
        document.getElementById("fileCount").textContent = String(summary.fileCount);
        document.getElementById("readmeName").textContent = summary.readmeName || t("none");
      } catch (error) {
        out.textContent = error?.message || String(error);
      }
    }

    document.getElementById("refresh").onclick = refresh;
    document.getElementById("copy").onclick = async () => {
      if (!latestText) await refresh();
      await window.pluginBridge.invoke("clipboard.writeText", { text: latestText });
      await window.pluginBridge.invoke("ui.showToast", { message: t("copied") });
    };
    window.__appearance.init(window.pluginBridge);
    window.__appearance.onLocaleChange(applyLocale);
    applyLocale();
    refresh();
  </script>
</body>
</html>
