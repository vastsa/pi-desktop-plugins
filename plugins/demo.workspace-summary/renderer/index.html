<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace Summary</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --card: #121a2f;
      --line: #24304d;
      --text: #e8eefc;
      --muted: #9db0d4;
      --accent: #4f7cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .muted { color: var(--muted); margin-bottom: 12px; }
    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      padding: 12px;
      margin-bottom: 12px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }
    button.secondary { background: #24304d; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--text);
      max-height: 360px;
      overflow: auto;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: rgba(255,255,255,0.02);
    }
    .stat b { display: block; font-size: 16px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Workspace Summary</h1>
  <div class="muted">Practical template plugin: inventory + README preview + clipboard export.</div>
  <div class="row">
    <button id="refresh">Refresh</button>
    <button class="secondary" id="copy">Copy summary</button>
  </div>
  <div class="stats">
    <div class="stat">Top-level<b id="topCount">-</b></div>
    <div class="stat">Files<b id="fileCount">-</b></div>
    <div class="stat">README<b id="readmeName">-</b></div>
  </div>
  <div class="card"><pre id="out">Open a workspace, then click Refresh.</pre></div>
  <script>
    let latestText = "";

    async function buildSummaryLocal() {
      const settings = await window.pluginBridge.invoke("plugin.getSettings");
      const maxEntries = Number(settings?.maxEntries ?? 30) || 30;
      const includeDotfiles = Boolean(settings?.includeDotfiles ?? false);
      const workspace = await window.pluginBridge.invoke("workspace.get");
      if (!workspace) {
        return {
          text: "No workspace is open.",
          topLevelCount: 0,
          fileCount: 0,
          readmeName: null,
        };
      }

      const all = await window.pluginBridge.invoke("fs.glob", { pattern: "**/*" });
      const skip = new Set([".git", "node_modules", "target", "dist", "build", ".next", ".cache", "out", "coverage"]);
      const visible = (all || []).filter((rel) => {
        const parts = String(rel).split("/");
        if (parts.some((p) => skip.has(p))) return false;
        if (!includeDotfiles && parts.some((p) => p.startsWith("."))) return false;
        return true;
      });
      const topLevel = [...new Set(visible.map((rel) => String(rel).split("/")[0]))]
        .filter(Boolean)
        .sort((a, b) => a.localeCompare(b))
        .slice(0, maxEntries);

      let readmeName = null;
      let readmeExcerpt = null;
      for (const name of ["README.md", "README.MD", "Readme.md", "readme.md"]) {
        try {
          const text = await window.pluginBridge.invoke("fs.readText", { path: name });
          readmeName = name;
          const normalized = String(text || "").replace(/\r\n/g, "\n").trim();
          readmeExcerpt = normalized.length > 600 ? normalized.slice(0, 600).trimEnd() + "\n…" : normalized;
          break;
        } catch {}
      }

      const lines = [
        `# Workspace Summary`,
        "",
        `- Project: ${workspace.name}`,
        `- Path: ${workspace.path}`,
        `- Top-level entries: ${topLevel.length}`,
        `- Approximate file count: ${visible.length}`,
        "",
        "## Top-level",
        ...topLevel.map((name) => `- ${name}`),
      ];
      if (readmeName) {
        lines.push("", `## ${readmeName}`, "", readmeExcerpt || "");
      }
      lines.push("", `_Generated by demo.workspace-summary_`);
      return {
        text: lines.join("\n"),
        topLevelCount: topLevel.length,
        fileCount: visible.length,
        readmeName,
      };
    }

    async function refresh() {
      const out = document.getElementById("out");
      out.textContent = "Scanning workspace…";
      try {
        const summary = await buildSummaryLocal();
        latestText = summary.text;
        out.textContent = summary.text;
        document.getElementById("topCount").textContent = String(summary.topLevelCount);
        document.getElementById("fileCount").textContent = String(summary.fileCount);
        document.getElementById("readmeName").textContent = summary.readmeName || "none";
      } catch (error) {
        out.textContent = error?.message || String(error);
      }
    }

    document.getElementById("refresh").onclick = refresh;
    document.getElementById("copy").onclick = async () => {
      if (!latestText) await refresh();
      await window.pluginBridge.invoke("clipboard.writeText", { text: latestText });
      await window.pluginBridge.invoke("ui.showToast", { message: "Summary copied" });
    };
    refresh();
  </script>
</body>
</html>
