    <!-- v3 paint-through chrome contract: PI-Desktop owns exactly a 46px drag band at the top; the three-button window-control capsule is drawn by the host. Panels reserve this strip via var(--pi-plugin-titlebar-height, 46px). -->
    <title>一体化会话导入</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #181818;
        --surface: #212121;
        --surface-hover: color-mix(in oklab, #ffffff 6%, transparent);
        --fg: #ffffff;
        --secondary: color-mix(in oklab, #ffffff 70%, transparent);
        --muted: color-mix(in oklab, #ffffff 52%, transparent);
        --border: color-mix(in oklab, #ffffff 10%, transparent);
        --accent: #ffffff;
        --on-accent: #181818;
        --user-bubble: color-mix(in oklab, #4c8dff 16%, transparent);
        --user-border: color-mix(in oklab, #4c8dff 35%, transparent);
        --ok: #3ecf8e;
        --err: #ff6b6b;
      }
      :root[data-base="light"] {
        color-scheme: light;
        --bg: #ffffff;
        --surface: #f6f7f8;
        --surface-hover: color-mix(in oklab, #1a1c1f 5%, transparent);
        --fg: #1a1c1f;
        --secondary: color-mix(in oklab, #1a1c1f 74%, transparent);
        --muted: #5d5d5d;
        --border: color-mix(in oklab, #1a1c1f 10%, transparent);
        --accent: #1a1c1f;
        --on-accent: #ffffff;
        --user-bubble: color-mix(in oklab, #4c8dff 12%, transparent);
        --user-border: color-mix(in oklab, #4c8dff 30%, transparent);
        --ok: #1f9d6b;
        --err: #d64545;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100%;
        padding: var(--pi-plugin-titlebar-height, 46px) 14px 14px;
        font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .app {
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: calc(100vh - var(--pi-plugin-titlebar-height, 46px) - 28px);
      }
      header.topbar {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      h1 { margin: 0; font-size: 15px; font-weight: 650; }
      .hint { color: var(--muted); font-size: 11.5px; }
      .spacer { flex: 1; }
      button {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 12px;
        background: var(--surface);
        color: var(--fg);
        cursor: pointer;
        font: inherit;
      }
      button:hover { background: var(--surface-hover); }
      button.primary {
        background: var(--accent);
        color: var(--on-accent);
        border-color: transparent;
        font-weight: 600;
      }
      button.primary:disabled, button:disabled { opacity: 0.45; cursor: default; }
      button.link {
        background: none;
        border: none;
        color: var(--secondary);
        text-decoration: underline;
        padding: 2px 4px;
      }
      .source-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 8px;
      }
      .source-card {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        background: var(--surface);
        cursor: pointer;
      }
      .source-card:hover { background: var(--surface-hover); }
      .source-card.active { border-color: var(--muted); }
      .source-card.dim { opacity: 0.45; cursor: default; }
      .source-card .sname { font-weight: 650; font-size: 13px; }
      .source-card .scount { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
      .source-card .scount.ok { color: var(--ok); }
      .source-card .sbadge {
        display: inline-block;
        margin-left: 6px;
        padding: 0 5px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
        vertical-align: 1px;
      }
      .custom-sources {
        margin-top: 10px;
        border: 1px dashed var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 11.5px;
        color: var(--muted);
        background: var(--surface);
      }
      .custom-sources .cs-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-weight: 650;
        color: var(--text);
      }
      .custom-sources .cs-body { margin-top: 4px; line-height: 1.55; }
      .custom-sources .cs-errors { margin-top: 4px; color: var(--warn, #b58900); white-space: pre-wrap; }
      .custom-sources code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      main.panes {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 330px 1fr;
        gap: 12px;
      }
      .list-pane, .preview-pane {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      .list-tools {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 8px;
        border-bottom: 1px solid var(--border);
      }
      .list-tools input[type="search"] {
        flex: 1;
        min-width: 0;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--fg);
        font: inherit;
        padding: 5px 8px;
        outline: none;
      }
      #session-list {
        flex: 1;
        overflow-y: auto;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .group-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 8px 4px;
        position: sticky;
        top: 0;
        background: var(--surface);
        z-index: 1;
        border-radius: 8px;
        cursor: pointer;
        user-select: none;
      }
      .group-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
      .chev {
        display: inline-block;
        width: 10px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1;
        text-align: center;
        transition: transform 0.22s ease;
      }
      .group-head .gname { font-weight: 650; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .group-head .gcount { color: var(--muted); font-size: 11px; white-space: nowrap; }
      .group-head button { margin-left: auto; padding: 2px 8px; font-size: 11px; border-radius: 6px; }
      .group-body {
        display: grid;
        grid-template-rows: 1fr;
        opacity: 1;
        transition: grid-template-rows 0.26s ease, opacity 0.18s ease;
      }
      .group-body > .group-body-inner {
        overflow: hidden;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .group.collapsed .group-body {
        grid-template-rows: 0fr;
        opacity: 0;
        pointer-events: none;
      }
      .session-row {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px;
        align-items: start;
        padding: 8px;
        border-radius: 8px;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .session-row:hover { background: var(--surface-hover); }
      .session-row.active { border-color: var(--muted); background: var(--surface-hover); }
      .session-row .title {
        font-weight: 550;

        text-overflow: ellipsis;

      .session-row .meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; }
      .session-row input[type="checkbox"] { accent-color: var(--accent); margin-top: 2px; }
      .preview-head { padding: 10px 12px; border-bottom: 1px solid var(--border); }
      .preview-head .t { font-weight: 650; font-size: 13.5px; }
      .preview-head .m { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg { border-radius: 10px; padding: 9px 11px; }
      .msg.user {
        background: var(--user-bubble);
        border: 1px solid var(--user-border);
        align-self: flex-end;
        max-width: 88%;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .msg.assistant {
        background: var(--bg);
        border: 1px solid var(--border);
        align-self: flex-start;
        max-width: 94%;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .msg.tool {
        align-self: flex-start;
        max-width: 94%;
        border: 1px dashed var(--border);
        border-radius: 8px;
        padding: 0;
        overflow: hidden;
      }
      .msg.tool summary {
        cursor: pointer;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--secondary);
        list-style: none;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .msg.tool summary::-webkit-details-marker { display: none; }
      .msg.tool[open] summary { border-bottom: 1px solid var(--border); }
      .tool-status { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); }
      .tool-status.success { color: var(--ok); }
      .tool-status.error { color: var(--err); }
      .msg.tool pre {
        margin: 0;
        padding: 8px 10px;
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--secondary);
        max-height: 220px;
        overflow-y: auto;
      }
      .empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--muted);
        text-align: center;
        padding: 20px;
      }
      .empty .big { font-size: 14px; color: var(--secondary); }
      .empty code {
        font: 11px ui-monospace, Menlo, monospace;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 6px;
        overflow-wrap: anywhere;
      }
      footer.bar { display: flex; align-items: center; gap: 10px; }
      .bind-opt { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; cursor: pointer; white-space: nowrap; }
      .bind-opt input { accent-color: var(--accent, #4c8dff); cursor: pointer; }
      #status { color: var(--muted); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #status.ok { color: var(--ok); }
      #status.err { color: var(--err); }
      .count { color: var(--muted); font-size: 12px; }
      .hidden { display: none !important; }
      @container (max-width: 760px) {
        main.panes { grid-template-columns: 1fr; grid-template-rows: 40% 1fr; }
      }
      main.panes { container-type: inline-size; }
    </style>

    <script src="../lib/i18n.js"></script>
    <script>
      "use strict";
      const bridge = window.pluginBridge;
      const SI = window.SI18n;
      let locale = SI.detectLocale();
      const t = (key, params) => SI.getMessage(locale, key, params);
      const SEP = () => (locale === "zh-CN" ? "，" : ", ");
      const $ = (id) => document.getElementById(id);
      const state = {
        adapters: [],
        sources: new Map(), // source -> {found, count}
        sessions: [],
        activeSource: null,
        selected: new Set(),
        activeKey: null,
        cache: new Map(), // `${source}:${externalId}` -> converted session
      };

      // --- P1-U1: i18n chrome + locale resolution ---
      function paintChrome() {
        document.documentElement.lang = locale === "zh-CN" ? "zh-CN" : "en";
        document.title = t("app.title");
        const h1 = document.querySelector("h1");
        if (h1) h1.textContent = t("importer.heading");
        const hint = $("importer-hint");
        if (hint) hint.textContent = t("importer.hint");
        const scan = $("scan-btn");
        if (scan) scan.textContent = t("importer.scan");
        const filter = $("filter");
        if (filter) filter.placeholder = t("importer.filter.placeholder");
        const selAll = $("select-all");
        if (selAll) selAll.textContent = t("importer.selectAll");
        const clr = $("clear-all");
        if (clr) clr.textContent = t("importer.clearAll");
        const list = $("session-list");
        if (list) list.setAttribute("aria-label", t("importer.listbox.label"));
        const pe = $("preview-empty");
        if (pe) pe.textContent = t("importer.previewEmpty");
        const imp = $("import-btn");
        if (imp) imp.textContent = t("importer.import");
        const bindLabel = $("bind-projects-label");
        if (bindLabel) bindLabel.textContent = t("importer.bindProjects");
        const bindOpt = $("bind-opt");
        if (bindOpt) bindOpt.title = t("importer.bindProjects.hint");
      }
      async function initLocale() {
        try {
          const hostLocale = await bridge.invoke("app.locale");
          if (hostLocale) locale = /^zh/i.test(String(hostLocale)) ? "zh-CN" : "en";
        } catch {
          // host SDK does not expose a locale — fall back to navigator
        }
        if (!locale) locale = SI.detectLocale();
        paintChrome();
      }
      // The work-panel has no native push channel; re-localize when the
      // panel regains focus as a proxy for "host locale changed".
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") relocalize();
      });
      async function relocalize() {
        await initLocale();
        if (state.sessions.length) {
          renderList();
          updateCount();
        }
      }

      const applyAppearance = (appearance) => {
        const base = appearance?.base;
        document.documentElement.dataset.base = base === "light" || base === "dark"
          ? base
          : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      };
      bridge?.on("appearance:changed", applyAppearance);
      bridge?.invoke("app.getAppearance").then(applyAppearance).catch(() => applyAppearance(null));

      const fmtDate = (iso) => {
        const d = new Date(iso);
        return Number.isNaN(d.getTime()) ? iso : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
      };
      // P1-U2: escape helper removed — all dynamic content is now set via
      // textContent / DOM API, so no innerHTML interpolation is needed.
      const clear = (el) => { while (el && el.firstChild) el.removeChild(el.firstChild); };
      const setStatus = (text, kind = "") => {
        const el = $("status");
        el.textContent = text;
        el.className = kind;
      };
      const updateCount = () => {
        $("count").textContent = t("importer.count.selected", {
          selected: state.selected.size,
          total: state.sessions.length,
        });
        $("import-btn").disabled = state.selected.size === 0;
      };

      async function scanSources() {
        $("scan-btn").disabled = true;
        const grid = $("source-grid");
        clear(grid);
        $("panes").classList.add("hidden");
        setStatus(t("importer.status.scanning"));
        state.sources = new Map();
        state.activeSource = null;
        state.selected.clear();
        state.cache.clear();

        const cards = [];
        for (const a of state.adapters) {
          const card = document.createElement("div");
          card.className = "source-card dim";
          const sname = document.createElement("div");
          sname.className = "sname";
          sname.textContent = a.label;
          if (a.custom) {
            const badge = document.createElement("span");
            badge.className = "sbadge";
            badge.textContent = t("importer.custom.badge");
            sname.appendChild(badge);
          }
          const scount = document.createElement("div");
          scount.className = "scount";
          scount.textContent = t("importer.source.detecting");
          card.append(sname, scount);
          card.addEventListener("click", () => openSource(a.source));
          grid.appendChild(card);
          cards.push({ adapter: a, card });
        }
        await Promise.all(
          cards.map(async ({ adapter, card }) => {
            let res;
            try {
              res = await bridge.invoke("import.scanSource", { source: adapter.source });
            } catch {
              res = { found: false, count: 0 };
            }
            state.sources.set(adapter.source, res);
            card.classList.remove("dim");
            if (res.found) {
              const sc = card.querySelector(".scount");
              paintCount(sc, res, adapter.source);
              sc.classList.add("ok");
            } else if (res.error && res.error.code === "TIMEOUT") {
              const sc = card.querySelector(".scount");
              sc.textContent = t("importer.source.scanTimeout");
              sc.classList.add("warn");
            } else if (res.error) {
              const sc = card.querySelector(".scount");
              sc.textContent = t("importer.source.scanFailed");
              sc.classList.add("warn");
            } else {
              card.querySelector(".scount").textContent = t("importer.source.notFound");
            }
          }),
        );
        setStatus(t("importer.status.scanDone"), "ok");
        // A partial result came from a cheap first pass; the plugin keeps
        // scanning and updates the count in place once it is complete.
        void refreshPartialSources(cards);
      }

      function paintCount(node, res, source) {
        if (!node) return;
        const base = t("importer.count.sessions", { count: res.count });
        node.textContent = res.partial ? `${base} ${t("importer.count.scanningMore")}` : base;
        if (res.oversized > 0) {
          node.textContent += ` ${t("importer.count.oversized", { count: res.oversized })}`;
          node.classList.add("warn");
        }
        node.dataset.source = source;
      }

      async function refreshPartialSources(cards) {
        const partial = cards.filter(({ adapter }) => {
          const info = state.sources.get(adapter.source);
          return info?.partial === true;
        });
        if (!partial.length) return;
        // The plugin promotes partial scans in the background; poll a few
        // times so the card count settles without the user re-clicking.
        for (let attempt = 0; attempt < 10; attempt += 1) {
          await new Promise((r) => setTimeout(r, 1200));
          let anyPartial = false;
          await Promise.all(
            partial.map(async ({ adapter, card }) => {
              let res;
              try {
                res = await bridge.invoke("import.scanSource", { source: adapter.source });
              } catch {
                return;
              }
              state.sources.set(adapter.source, res);
              const sc = card.querySelector(".scount");
              paintCount(sc, res, adapter.source);
              if (res.partial) anyPartial = true;
            }),
          );
          if (!anyPartial) return;
        }
      }

      function openSource(source) {
        const info = state.sources.get(source);
        if (!info?.found) return;
        state.activeSource = source;
        state.selected.clear();
        state.activeKey = null;
        state.sessions = [];
        document.querySelectorAll(".source-card").forEach((card, i) => {
          card.classList.toggle("active", state.adapters[i]?.source === source);
        });
        $("panes").classList.remove("hidden");
        clear($("session-list"));
        renderPreviewEmpty();
        setStatus(t("importer.status.loadingList"));
        bridge
          .invoke("import.sessions", { source })
          .then((res) => {
            state.sessions = res.sessions;
            renderList();
            renderPreviewEmpty();
            updateCount();
            setStatus(t("importer.count.sessions", { count: res.sessions.length }));
          })
          .catch((error) => setStatus(t("importer.status.loadFailed", { error }), "err"));
      }

      const matchesFilter = (s, q) =>
        !q || s.title.toLowerCase().includes(q) || (s.projectPath ?? "").toLowerCase().includes(q);

      const COLLAPSE_KEY = "pi-universal-import.collapsedProjects";
      let collapsedProjects = new Set();
      try {
        collapsedProjects = new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY) || "[]"));
      } catch {
        collapsedProjects = new Set();
      }
      const saveCollapsed = () => {
        try {
          localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsedProjects]));
        } catch {
          // persistence is best-effort; collapse still works in-session
        }
      };

      function renderList() {
        const q = $("filter").value.trim().toLowerCase();
        const list = $("session-list");
        clear(list);
        const visible = state.sessions.filter((s) => matchesFilter(s, q));
        const groups = new Map();
        for (const s of visible) {
          const key = s.projectPath ?? "";
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(s);
        }
        for (const [projectPath, sessions] of groups) {
          const groupKey = projectPath || "__none__";
          const isCollapsed = collapsedProjects.has(groupKey);

          const group = document.createElement("div");
          group.className = "group " + (isCollapsed ? "collapsed" : "expanded");

          const head = document.createElement("div");
          head.className = "group-head";
          head.setAttribute("role", "button");
          head.setAttribute("tabindex", "0");
          head.setAttribute("aria-expanded", String(!isCollapsed));
          head.title = projectPath || "";
          const name = projectPath
            ? projectPath.replace(/[\\/]+$/, "").split(/[\\/]/).pop()
            : t("importer.group.noProject");
          const chev = document.createElement("span");
          chev.className = "chev";
          chev.textContent = "▶";
          const gname = document.createElement("span");
          gname.className = "gname";
          gname.textContent = name;
          const gcount = document.createElement("span");
          gcount.className = "gcount";
          gcount.textContent = t("importer.count.sessions", { count: sessions.length });
          head.append(chev, gname, gcount);

          const allSelected = sessions.every((s) => state.selected.has(s.externalId));
          const btn = document.createElement("button");
          btn.textContent = allSelected ? t("importer.group.deselectAll") : t("importer.group.selectAll");
          // Selecting a whole project must not toggle the accordion.
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            for (const s of sessions) {
              allSelected ? state.selected.delete(s.externalId) : state.selected.add(s.externalId);
            }
            renderList();
            updateCount();
          });
          head.appendChild(btn);

          const toggleCollapse = () => {
            const nowCollapsed = !group.classList.contains("collapsed");
            group.classList.toggle("collapsed", nowCollapsed);
            group.classList.toggle("expanded", !nowCollapsed);
            head.setAttribute("aria-expanded", String(!nowCollapsed));
            nowCollapsed ? collapsedProjects.add(groupKey) : collapsedProjects.delete(groupKey);
            saveCollapsed();
          };
          head.addEventListener("click", toggleCollapse);
          head.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              toggleCollapse();
            }
          });

          const body = document.createElement("div");
          body.className = "group-body";
          const inner = document.createElement("div");
          inner.className = "group-body-inner";

          for (const s of sessions) {
            const row = document.createElement("div");
            row.className = "session-row" + (s.externalId === state.activeKey ? " active" : "");
            row.setAttribute("role", "option");
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = state.selected.has(s.externalId);
            cb.addEventListener("click", (e) => e.stopPropagation());
            cb.addEventListener("change", () => {
              cb.checked ? state.selected.add(s.externalId) : state.selected.delete(s.externalId);
              updateCount();
            });
            const text = document.createElement("div");
            const titleEl = document.createElement("div");
            titleEl.className = "title";
            titleEl.textContent = s.title;
            const metaEl = document.createElement("div");
            metaEl.className = "meta";
            const mDate = document.createElement("span");
            mDate.textContent = fmtDate(s.updatedAt);
            const mDot = document.createElement("span");
            mDot.textContent = "·";
            const mCount = document.createElement("span");
            mCount.textContent = t("importer.preview.Nmessages", { count: s.messageCount });
            metaEl.append(mDate, mDot, mCount);
            text.append(titleEl, metaEl);
            row.append(cb, text);
            row.addEventListener("click", () => selectSession(s));
            inner.appendChild(row);
          }

          body.appendChild(inner);
          group.append(head, body);
          list.appendChild(group);
        }
      }

      function renderPreviewEmpty() {
        $("preview-empty").classList.remove("hidden");
        $("preview-head").classList.add("hidden");
        $("messages").classList.add("hidden");
        clear($("messages"));
      }

      async function selectSession(summary) {
        state.activeKey = summary.externalId;
        renderList();
        $("preview-empty").classList.add("hidden");
        $("preview-head").classList.remove("hidden");
        $("messages").classList.remove("hidden");
        clear($("messages"));
        setStatus(t("importer.status.loadingList"));
        try {
          const cacheKey = `${state.activeSource}:${summary.externalId}`;
          let converted = state.cache.get(cacheKey);
          if (!converted) {
            const res = await bridge.invoke("import.convertBatch", {
              source: state.activeSource,
              items: [summary],
            });
            converted = res.sessions[0];
            state.cache.set(cacheKey, converted);
          }
          $("pv-title").textContent = converted.session.title;
          $("pv-meta").textContent = [
            converted.session.projectPath ?? t("importer.preview.noProject"),
            converted.session.modelId ?? t("importer.preview.unknownModel"),
            t("importer.preview.Nmessages", { count: converted.messages.length }),
            t("importer.preview.updatedAt", { date: fmtDate(converted.session.updatedAt) }),
          ].join(" · ");
          const box = $("messages");
          for (const m of converted.messages) {
            if (m.role === "tool") {
              const details = document.createElement("details");
              details.className = "msg tool";
              const mark = m.toolStatus === "error" ? "❌" : "🔧";
              const summary = document.createElement("summary");
              const markSpan = document.createElement("span");
              markSpan.textContent = `${mark} ${m.toolName}`;
              const statusSpan = document.createElement("span");
              statusSpan.className = `tool-status ${m.toolStatus}`;
              statusSpan.textContent = m.toolStatus;
              summary.append(markSpan, statusSpan);
              details.appendChild(summary);
              const pre = document.createElement("pre");
              pre.textContent = [
                m.toolArgs != null ? "args: " + JSON.stringify(m.toolArgs, null, 2) : null,
                m.toolResult ? "result: " + m.toolResult : null,
              ].filter(Boolean).join("\n\n");
              details.appendChild(pre);
              box.appendChild(details);
            } else {
              const div = document.createElement("div");
              div.className = `msg ${m.role}`;
              div.textContent = m.content;
              box.appendChild(div);
            }
          }
          setStatus(t("importer.status.loadedMessages", { count: converted.messages.length }));
        } catch (error) {
          setStatus(t("importer.status.loadFailed", { error }), "err");
        }
      }

      async function importSelected() {
        const summaries = state.sessions.filter((s) => state.selected.has(s.externalId));
        if (summaries.length === 0) return;
        $("import-btn").disabled = true;
        setStatus(t("importer.importing", { count: summaries.length }));
        try {
          // Single entry point: main.js decides official importBatch vs the
          // legacy session.import bridge, and falls back gracefully when the
          // host exposes no session-import API at all.
          const r = await bridge.invoke("import.commit", {
            source: state.activeSource,
            items: summaries,
            placement: $("bind-projects").checked ? "project" : "standalone",
          });
          window.__lastTimings = r.timings || null;
          const parts = [t("importer.imported", { count: r.imported })];
          if (r.skipped) parts.push(t("importer.skipped", { count: r.skipped }));
          if (r.unreadable) parts.push(t("importer.unreadable", { count: r.unreadable }));
          if (r.failed?.length) parts.push(t("importer.failed", { count: r.failed.length }));
          if (r.truncated) parts.push(t("importer.truncated", { count: r.truncated }));
          if (r.imported === 0 && r.failed?.length) parts.push(t("importer.hostHint"));
          if (r.timings) {
            parts.push(
              t("importer.importDone.timing", {
                total: (
                  (r.timings.convertMs + r.timings.buildMs + r.timings.importMs) /
                  1000
                ).toFixed(1),
                convert: (r.timings.convertMs / 1000).toFixed(1),
                host: (r.timings.importMs / 1000).toFixed(1),
              }),
            );
          }
          parts.push(
            $("bind-projects").checked
              ? t("importer.importDone.project")
              : t("importer.importDone.tail"),
          );
          setStatus(parts.join(SEP()), r.failed?.length ? "err" : r.truncated ? "warn" : "ok");
          // P0-F2: native notification telling the user to switch to the
          // forge view. pluginBridge cannot reach pi.ui.* from the sandboxed
          // view, so we route through the host via a dedicated channel.
          if (r.imported > 0) {
            try {
              await bridge.invoke("import.notify", {
                title: t("importer.notify.title"),
                body: t("importer.notify.body", { source: state.activeSource, count: r.imported }),
              });
            } catch { /* host missing the channel — silent */ }
          }
        } catch (error) {
          setStatus(t("importer.importFailed", { error }), "err");
        } finally {
          $("import-btn").disabled = state.selected.size === 0;
        }
      }

      $("scan-btn").addEventListener("click", scanSources);
      $("import-btn").addEventListener("click", importSelected);
      // Project grouping is the default: imported sessions belong under the
      // project they came from, matching the left sidebar's PROJECTS list.
      // Unchecked imports land in the standalone session list instead. The
      // choice is remembered per panel.
      const BIND_KEY = "pi-universal-import.bindProjects";
      const bindBox = $("bind-projects");
      try {
        const stored = localStorage.getItem(BIND_KEY);
        bindBox.checked = stored === null ? true : stored === "1";
      } catch { /* best-effort */ }
      bindBox.addEventListener("change", () => {
        try {
          localStorage.setItem(BIND_KEY, bindBox.checked ? "1" : "0");
        } catch { /* best-effort */ }
      });
      $("filter").addEventListener("input", renderList);
      $("select-all").addEventListener("click", () => {
        const q = $("filter").value.trim().toLowerCase();
        for (const s of state.sessions) if (matchesFilter(s, q)) state.selected.add(s.externalId);
        renderList();
        updateCount();
      });
      $("clear-all").addEventListener("click", () => {
        state.selected.clear();
        renderList();
        updateCount();
      });

      async function loadCustomSourcesInfo() {
        try {
          const info = await bridge.invoke("import.customSources");
          renderCustomSources(info);
          return info;
        } catch {
          // Host without the channel (older build) -> hide the panel entirely.
          const panel = $("custom-sources");
          if (panel) panel.hidden = true;
          return null;
        }
      }

      function renderCustomSources(info) {
        const panel = $("custom-sources");
        if (!panel || !info) return;
        $("cs-title").textContent = t("importer.custom.title");
        $("cs-reload").textContent = t("importer.custom.reload");
        $("cs-hint").textContent = t("importer.custom.hint", {
          path: info.configPath || "docs/session-import-sources.json",
        });
        $("cs-count").textContent = t("importer.custom.count", { count: info.count || 0 });
        $("cs-drivers").textContent =
          Array.isArray(info.drivers) && info.drivers.length
            ? t("importer.custom.drivers", { drivers: info.drivers.join(", ") })
            : "";
        const errs = Array.isArray(info.errors) ? info.errors : [];
        const errNode = $("cs-errors");
        errNode.textContent = errs.length
          ? t("importer.custom.errors", { errors: errs.join("; ") })
          : "";
        errNode.style.display = errs.length ? "" : "none";
      }

      (async () => {
        await initLocale();
        state.adapters = await bridge.invoke("import.adapters");
        await loadCustomSourcesInfo();

        $("cs-reload").addEventListener("click", async () => {
          try {
            const info = await bridge.invoke("import.reloadCustomSources");
            state.adapters = await bridge.invoke("import.adapters");
            renderCustomSources(info);
            // Re-scan so a newly added source shows up immediately.
            await scanSources();
            setStatus(t("importer.custom.reloaded"), "ok");
          } catch (err) {
            setStatus(
              t("importer.custom.reloadFailed", { error: String((err && err.message) || err) }),
              "err",
            );
          }
        });
      })();
    </script>
  </body>
</html>
