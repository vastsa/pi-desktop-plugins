<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      PI-Desktop owns exactly a 46px drag band and a minimal three-button
      window-control capsule. This panel uses pi-plugin-chrome=v3: the page can
      paint through the 46px band, while host-generated holes keep controls
      clickable and empty space draggable. Fixed or sticky panel surfaces use
      var(--pi-plugin-titlebar-height, 46px).
    -->
    <meta name="pi-plugin-chrome" content="v3" />
    <title>超级域名侠</title>
    <script>window.__APPEARANCE_CACHE_KEY = "sdm.appearance.v1";</script>
    <script src="./appearance-boot.js"></script>
    <script>
      /* 渲染前恢复主题/语言（避免闪屏）。
       * 优先级：外观缓存（sdm.appearance.v1，宿主上次外观）→ 面板自带 sdm.settings.theme → 系统偏好。
       * 编译产物 bundle 挂载时会按 sdm.settings.theme 重设 data-theme，
       * 故当其为 "system" 时预先把该值同步为解析后的 base，保证两者一致。 */
      (function () {
        var boot = window.__appearanceBoot;
        if (!boot) return;
        var base = null;
        if (boot.cached && (boot.cached.base === "light" || boot.cached.base === "dark")) {
          base = boot.cached.base;
        }
        var settingsTheme = "system";
        try {
          var s = JSON.parse(localStorage.getItem("sdm.settings") || "{}");
          if (s.theme) settingsTheme = s.theme;
        } catch (e) {
          /* 保持默认 */
        }
        if (!base) {
          base = settingsTheme === "light" || settingsTheme === "dark"
            ? settingsTheme
            : boot.prefersLight() ? "light" : "dark";
        }
        boot.applyAppearance({ base: base, locale: document.documentElement.lang });
        if (settingsTheme === "system" && base !== "system") {
          try {
            var s2 = JSON.parse(localStorage.getItem("sdm.settings") || "{}");
            s2.theme = base;
            localStorage.setItem("sdm.settings", JSON.stringify(s2));
          } catch (e) {
            /* 忽略 */
          }
        }
        try {
          localStorage.setItem(boot.cacheKey, JSON.stringify({ base: base, locale: document.documentElement.lang }));
        } catch (e) {
          /* 忽略 */
        }
      })();
    </script>
    <script src="./assets/index.js" defer></script>
    <script>
      /* 数据同步桥：将面板 localStorage 数据同步到主进程，供 AI 工具 domain_manage 使用 */
      (function () {
        var SYNC_MS = 15000;
        function getMonitors() {
          try { var r = localStorage.getItem("sdm.monitor"); return r ? JSON.parse(r) : []; }
          catch (e) { return []; }
        }
        function getAccountMeta() {
          try {
            var raw = localStorage.getItem("sdm.accounts");
            if (!raw) return [];
            var arr = JSON.parse(raw);
            if (!Array.isArray(arr)) return [];
            return arr.map(function (a) {
              return { id: a.id, cloud: a.cloud, tag: a.tag || "", domains: a.domains || [] };
            });
          } catch (e) { return []; }
        }
        function sync() {
          try {
            if (typeof pi !== "undefined" && pi.invoke) {
              pi.invoke("domain.sync", { monitors: getMonitors(), accounts: getAccountMeta() });
            }
          } catch (e) { /* 静默失败 */ }
        }
        setInterval(sync, SYNC_MS);
        setTimeout(sync, 3000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="./appearance.js"></script>
    <script>
      /* 外观适配器：拉取 app 主体主题/语言并订阅实时变化；旧版宿主无通道时静默回退 */
      if (window.__appearance) {
        window.__appearance.init(window.pluginBridge);
      }
    </script>
    <script src="./style-boot.js"></script>
    <script src="./capsule-retint.js"></script>
  </body>
</html>
