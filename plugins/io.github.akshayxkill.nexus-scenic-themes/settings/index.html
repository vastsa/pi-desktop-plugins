<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Scenic Themes</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main>
      <header><h1 id="title">Nexus Scenic Themes</h1><p id="description">Choose a scenic theme. Backdrop blur affects only the image.</p></header>
      <section id="theme-cards" class="cards" aria-label="Scenic themes"></section>
      <section class="blur-card" aria-labelledby="blur-label">
        <div><h2 id="blur-label">Backdrop blur</h2><p id="blur-help">Applied only to the selected theme's backdrop image.</p></div>
        <label class="range"><input id="blur" type="range" min="0" max="20" step="1" value="6" aria-describedby="blur-help blur-value" /><output id="blur-value" aria-live="polite">6px</output><button id="apply-blur" type="button">Apply</button></label>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
