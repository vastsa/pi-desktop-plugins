<!doctype html>
<html lang="zh-CN" data-lang="zh" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none'; form-action 'none'; base-uri 'none'"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Insights</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <!-- 46px drag strip. OS window controls are drawn by the host, never here. -->
  <header class="titlebar" id="titlebar">
    <div class="titlebar-title" id="appTitle">Token Insights</div>
    <div class="titlebar-actions">
      <div class="segmented" id="rangeSwitch" role="group" aria-label="时间范围">
        <button type="button" class="segment" data-range="30d">30D</button>
        <button type="button" class="segment" data-range="1y">1Y</button>
        <button type="button" class="segment" data-range="all">ALL</button>
      </div>
      <button type="button" class="icon-button" id="refreshBtn" title="重新载入最新快照" aria-label="重新载入最新快照">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M8 16H3v5" />
        </svg>
      </button>
    </div>
  </header>

  <main class="scroll" id="scroll">
    <div class="state" id="stateBox" hidden>
      <div class="state-title" id="stateTitle"></div>
      <div class="state-body" id="stateBody"></div>
    </div>

    <div id="content" hidden>
      <section class="hero">
        <div class="hero-line">
          <span class="hero-quote" id="heroQuote"></span>
          <span class="delta" id="heroDelta" hidden></span>
        </div>
        <div class="hero-number" id="heroNumber">0</div>
        <div class="hero-sub" id="heroSub"></div>
        <div class="sparkline" id="sparkline" aria-hidden="true"></div>
      </section>

      <section class="tiles">
        <div class="tile">
          <div class="tile-label" id="tileInputLabel">输入</div>
          <div class="tile-value" id="tileInput">—</div>
          <div class="tile-note" id="tileInputNote"></div>
        </div>
        <div class="tile">
          <div class="tile-label" id="tileOutputLabel">输出</div>
          <div class="tile-value" id="tileOutput">—</div>
          <div class="tile-note" id="tileOutputNote"></div>
        </div>
        <div class="tile">
          <div class="tile-label" id="tileCacheLabel">缓存读取</div>
          <div class="tile-value" id="tileCache">—</div>
          <div class="tile-note" id="tileCacheNote"></div>
        </div>
        <div class="tile">
          <div class="tile-label" id="tileReasoningLabel">推理</div>
          <div class="tile-value" id="tileReasoning">—</div>
          <div class="tile-note" id="tileReasoningNote"></div>
        </div>
      </section>

      <section class="block">
        <div class="block-head">
          <h2 id="activityTitle">Activity</h2>
          <span class="block-note" id="streakNote"></span>
        </div>
        <div class="heatmap-wrap">
          <div class="heatmap-months" id="heatMonths" aria-hidden="true"></div>
          <div class="heatmap-body">
            <div class="heatmap-days" id="heatDays" aria-hidden="true"></div>
            <div class="heatmap" id="heatmap" role="img" aria-label="Activity heatmap"></div>
          </div>
        </div>
        <div class="heatmap-legend">
          <span class="tooltip" id="heatTip"></span>
          <span class="legend">
            <span id="legendLess">Less</span>
            <i data-level="0"></i><i data-level="1"></i><i data-level="2"></i>
            <i data-level="3"></i><i data-level="4"></i>
            <span id="legendMore">More</span>
          </span>
        </div>
      </section>

      <div class="split">
        <section class="block">
          <div class="block-head">
            <h2 id="modelsTitle">Models</h2>
            <span class="block-note" id="modelsNote"></span>
          </div>
          <div class="ranking" id="modelList"></div>
        </section>

        <section class="block">
          <div class="block-head">
            <h2 id="rhythmTitle">Rhythm</h2>
            <span class="block-note" id="rhythmNote"></span>
          </div>
          <div class="clock" id="clock" aria-hidden="true"></div>
          <div class="clock-axis" id="clockAxis" aria-hidden="true"></div>
          <div class="weekbar" id="weekbar" aria-hidden="true"></div>
        </section>
      </div>

      <div class="split">
        <section class="block">
          <div class="block-head">
            <h2 id="sourcesTitle">Tool sources</h2>
          </div>
          <div class="ranking" id="sourceList"></div>
        </section>

        <section class="block">
          <div class="block-head">
            <h2 id="sessionsTitle">Top sessions</h2>
          </div>
          <div class="ranking" id="sessionList"></div>
        </section>
      </div>

      <footer class="provenance">
        <div id="provenanceLine"></div>
        <div class="disclaimer" id="disclaimerLine"></div>
      </footer>
    </div>
  </main>

  <script src="panel.js"></script>
</body>
</html>
