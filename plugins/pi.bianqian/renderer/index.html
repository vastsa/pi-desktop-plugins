<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      PI-Desktop owns exactly a transparent 46px drag band and a minimal
      three-button window-control capsule. Normal-flow content is offset
      automatically; window-level fixed or sticky UI must start at
      top: var(--pi-plugin-titlebar-height, 46px).
    -->
    <!-- 预绘外观：同步、位于 body 之前，避免主题/语言闪变 -->
    <script>
      window.__APPEARANCE_CACHE_KEY = "pi.bianqian.appearance.v1";
    </script>
    <script src="./appearance-boot.js"></script>
    <link rel="stylesheet" href="./assets/app.css" />
  </head>
  <body>
    <div id="app"></div>
    <!-- file:// 下 module 脚本会被 CORS 阻止，产物为普通 IIFE 脚本 -->
    <script src="./assets/app.js"></script>
    <script src="./appearance.js"></script>
    <script>
      window.__appearance.init(window.pluginBridge);
    </script>
  </body>
</html>
